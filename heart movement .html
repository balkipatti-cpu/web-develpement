<!DOCTYPE HTML>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<title>create the heart of the html and pure css</title>
  <style>
  HTML{
  margin:0;
  padding:0;
  box-sizing:border-box;
  }
  .main-div{
  width:100vw;
  height:100vh;
  background-color:#fff;
  display:flex;
  justify-content:center;
  align-items:center;
  }
  .center-div
  {
  width:16rem;
  height:16rem;
  background:red;
  position:relative;
  transform:rotate(45deg);
  animation:dil .8s linear alternate infinite;
  }
  .center-div::before
  {
  content:"";
  width:100.8%;
  height:260px;
  background-color:red;
  position:absolute;
  transform:translatey(-60%);
  border-radius:60%;
  }.center-div::after
  
  {
  content:"";
  width:100.8%;
  height:258px;
  background-color:red;
  position:absolute;
  transform:translatex(-60%);
  border-radius:60%;
  }
  @keyframes dil{
  0%{
  transform: rotate(45deg) scale(1);
  background-color:red;
  
  }
  20%{
  
  transform: rotate(45deg) scale(1);

  
  }
  40%{
  transform: rotate(45deg) scale(1.4);
  }
  60%{
  transform: rotate(45deg) scale(1.2);
  }
  80%{
  transform: rotate(45deg) scale(1.4);
  } 
  100%{
  transform: rotate(45deg) scale(1);
  } 
  }
  
  </style>
</head>
<body>
<div class="main-div">
<div class="center-div"></div></div>
	
</body>
</html>
