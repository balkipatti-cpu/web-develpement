<!DOCTYPE HTML>
<html lang="en-US">
<head>
	<meta charset="UTF-8">
	<title></title>
	<style>
		*
		{
			margin:0;
			padding:0;
		}
		body
		{

			background:#222;
		}
		.plate
		{
			position:relative;
			width:200px;
			 height:200px;
			 margin:0 auto;
			}
			.plate::before
			{
				content:"";
				position:absolute;
				top:100%;
				left:50%;
				width:50px;
				height:10px;
				transform:translatex(-50%);
				background: #555;
				border-radius:50%;
			animation: key 1s infinite;
			}
			.ball
			{
				position:relative;
				margin:0 auto;
				width:50px;
				height:50px;
				top:0;
				background: #5cff5c;
				border-radius:50%;
				box-shadow:0rem 0rem 10px #5cff5c , 0 0 30px #5cff5c;
				animation:ball 1s infinite;
			}
				@keyframes ball
				{
				5%{
					width:50px;
					height:50px;
				}
				20%
				{
					height:60px;
				}
				30%
				{
					width:45px;
					height:60px;
				}
				50%
				{
					width:57px;
					height:35px;
					transform:translatey(275px);
				}
				75%
				{
					width:50px;
					height:50px;
				}
			}
				@keyframes key{

			25%{
				width:50px;
				height:10px;
			}
			50%
			{
				width:57px;
				height:10px;
			}

75%
{
	width:50px;
	height:10px;
}
			}
	</style>
</head>
<body>
	<div class="plate">
	</div>
	<div class="ball">
	</div>
	
</body>
</html>
